name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: diabetes-mlops

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-

    - name: Install dependencies
      run: poetry install --with dev,train --no-interaction

    - name: Lint
      run: |
        poetry run ruff check app ml tests scripts
        poetry run black --check app ml tests scripts

    - name: Run tests
      run: poetry run pytest --cov=app --cov=ml --cov-report=xml -v

    - name: Upload coverage
      uses: codecov/codecov-action@v5

  build:
    needs: test
    runs-on: ubuntu-latest
    # Images are only built and pushed on merge/tag, not for every PR
    if: github.event_name != 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - uses: actions/checkout@v4

    # Required for the GHA layer cache (type=gha)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha,format=long

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}
    env:
      DEPLOY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.DEPLOY_ENV == 'production' && 'prod-diabetes-eks' || 'conai-cluster' }}

    - name: Deploy with Helm
      run: |
        helm upgrade --install diabetes-${{ env.DEPLOY_ENV }} helm/ \
          --namespace ${{ env.DEPLOY_ENV }} --create-namespace \
          --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }} \
          --set image.tag=sha-${{ github.sha }} \
          --set environment=${{ env.DEPLOY_ENV }} \
          --set-string secrets.data.mlflow-uri=${{ vars.MLFLOW_URI || 'http://mlflow.mlops.svc.cluster.local:5000' }} \
          --set-string secrets.data.jwks-url=${{ vars.JWKS_URL || '' }} \
          --set-string secrets.data.issuer=${{ vars.ISSUER || '' }} \
          --wait --timeout=300s

    - name: Run smoke tests
      run: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=diabetes-${{ env.DEPLOY_ENV }} -n ${{ env.DEPLOY_ENV }} --timeout=300s
        kubectl port-forward -n ${{ env.DEPLOY_ENV }} svc/diabetes-${{ env.DEPLOY_ENV }}-diabetes-mlops 8080:8000 &
        PF_PID=$!
        sleep 10
        python scripts/smoke_test.py --base-url http://localhost:8080
        STATUS=$?
        kill $PF_PID || true
        exit $STATUS

  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result != 'skipped'
    steps:
    - name: Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            "text": "Deploy ${{ needs.deploy.result }}: ${{ github.repository }}@${{ github.ref_name }} (${{ github.sha }})"
          }
        channel: '#mlops'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
