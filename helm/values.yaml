replicaCount: 2

image:
  repository: 209479289560.dkr.ecr.us-east-1.amazonaws.com/diabetes-mlops
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.diabetes.conai.online
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: diabetes-tls
      hosts:
        - api.diabetes.conai.online

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

environment: "production"

monitoring:
  enabled: true
  serviceMonitor:
    # Requires the prometheus-operator CRDs on the cluster; enable explicitly.
    enabled: false
    interval: 30s
    path: /metrics

secrets:
  # Render helm/templates/secret.yaml from `data` below. Set create: false to
  # manage the secret externally (kubectl / ExternalSecrets).
  create: true
  name: diabetes-secrets
  data:
    mlflow-uri: "http://mlflow.mlops.svc.cluster.local:5000"
    jwks-url: ""
    issuer: ""
