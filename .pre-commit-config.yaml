minimum_pre_commit_version: '2.20.0'
repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit only)
        entry: pytest -m "not integration"
        language: system
        pass_filenames: false
