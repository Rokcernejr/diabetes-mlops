groups:
- name: diabetes-mlops
  rules:
  - alert: HighErrorRate
    expr: rate(api_requests_total{status_code=~"5.."}[5m]) > 0.1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High 5xx error rate detected"

  - alert: ModelPerformanceDegraded
    expr: ml_model_accuracy < 0.7
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Model performance below threshold"

  - alert: ServiceDown
    expr: up{job="fastapi"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Diabetes API service is down"
